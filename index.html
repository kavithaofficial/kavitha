<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Calculator</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --card: rgba(15, 23, 42, 0.75);
            --panel: rgba(148, 163, 184, 0.08);
            --primary: #8b5cf6;
            --primary-2: #6366f1;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --line: rgba(148, 163, 184, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app {
            width: min(960px, 100%);
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(15, 23, 42, 0.55);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(99, 102, 241, 0.25));
            padding: 28px 28px 18px;
            border-bottom: 1px solid var(--line);
        }

        .header h1 {
            margin: 0;
            font-size: clamp(26px, 4vw, 42px);
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            padding: 28px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 0.92rem;
            margin-bottom: 8px;
            color: var(--muted);
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: rgba(139, 92, 246, 0.8);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
        }

        .error {
            min-height: 18px;
            margin-top: 8px;
            color: #fca5a5;
            font-size: 0.8rem;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: transform 0.18s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.35);
        }

        .secondary {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text);
            border: 1px solid var(--line);
        }

        .danger {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
        }

        .subjects {
            margin-top: 20px;
        }

        .subjects h3, .result-box h3 {
            margin: 0 0 14px;
            font-size: 1.1rem;
            color: var(--text);
        }

        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 120px;
        }

        .subject-item {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .subject-name {
            font-weight: 700;
        }

        .subject-marks {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .remove-btn {
            border: none;
            background: rgba(239, 68, 68, 0.14);
            color: #fca5a5;
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 12px;
            color: var(--muted);
            text-align: center;
            padding: 24px 12px;
            background: rgba(15, 23, 42, 0.3);
        }

        .result-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .summary-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.14), rgba(99, 102, 241, 0.14));
            border: 1px solid rgba(139, 92, 246, 0.32);
            border-radius: 18px;
            padding: 18px;
            min-height: 160px;
        }

        .summary-card .student {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .average {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 800;
            line-height: 1;
        }

        .grade-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 800;
            color: white;
            margin-top: 14px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .stat {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.78rem;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
        }

        @media (max-width: 760px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>Student Grade Calculator</h1>
            <p>Track subject scores and instantly calculate the overall average and grade.</p>
        </div>

        <div class="layout">
            <div class="panel">
                <div class="form-grid">
                    <div class="full">
                        <label for="studentName">Student Name</label>
                        <input id="studentName" type="text" placeholder="Enter student name" />
                    </div>

                    <div>
                        <label for="subjectName">Subject</label>
                        <input id="subjectName" type="text" placeholder="e.g. Mathematics" />
                    </div>

                    <div>
                        <label for="marks">Marks</label>
                        <input id="marks" type="number" min="0" max="100" placeholder="0 - 100" />
                    </div>
                </div>

                <div class="error" id="marksError"></div>

                <div class="button-row">
                    <button class="primary" onclick="addSubject()">Add Subject</button>
                    <button class="secondary" onclick="calculateGrade()">Calculate</button>
                    <button class="danger" onclick="clearAll()">Clear All</button>
                </div>

                <div class="subjects">
                    <h3>Subjects</h3>
                    <div class="subject-list" id="subjectsContainer">
                        <div class="empty">No subjects added yet.</div>
                    </div>
                </div>
            </div>

            <div class="panel result-box">
                <h3>Result</h3>
                <div class="summary-card" id="resultBox">
                    <div class="student">Student: <strong>Not available</strong></div>
                    <div class="average">0%</div>
                    <div class="grade-badge" style="background: #64748b;">--</div>
                </div>

                <div class="stat-grid">
                    <div class="stat">
                        <div class="stat-label">Subjects</div>
                        <div class="stat-value" id="subjectCount">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Total</div>
                        <div class="stat-value" id="totalMarks">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let subjects = [];

        function addSubject() {
            const studentName = document.getElementById('studentName').value.trim();
            const subjectName = document.getElementById('subjectName').value.trim();
            const marks = parseFloat(document.getElementById('marks').value);

            document.getElementById('marksError').textContent = '';

            if (!studentName) {
                alert('Please enter student name.');
                return;
            }

            if (!subjectName) {
                alert('Please enter a subject name.');
                return;
            }

            if (Number.isNaN(marks) || marks < 0 || marks > 100) {
                document.getElementById('marksError').textContent = 'Marks must be between 0 and 100.';
                return;
            }

            subjects.push({ name: subjectName, marks });
            document.getElementById('subjectName').value = '';
            document.getElementById('marks').value = '';
            renderSubjects();
            calculateGrade();
        }

        function renderSubjects() {
            const container = document.getElementById('subjectsContainer');

            if (subjects.length === 0) {
                container.innerHTML = '<div class="empty">No subjects added yet.</div>';
                return;
            }

            container.innerHTML = subjects.map((subject, index) => `
                <div class="subject-item">
                    <div>
                        <div class="subject-name">${subject.name}</div>
                        <div class="subject-marks">Marks: ${subject.marks}/100</div>
                    </div>
                    <button class="remove-btn" onclick="removeSubject(${index})">Remove</button>
                </div>
            `).join('');
        }

        function removeSubject(index) {
            subjects.splice(index, 1);
            renderSubjects();
            calculateGrade();
        }

        function calculateGrade() {
            const studentName = document.getElementById('studentName').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (subjects.length === 0) {
                resultBox.innerHTML = `
                    <div class="student">Student: <strong>${studentName || 'Not available'}</strong></div>
                    <div class="average">0%</div>
                    <div class="grade-badge" style="background: #64748b;">--</div>
                `;
                document.getElementById('subjectCount').textContent = '0';
                document.getElementById('totalMarks').textContent = '0';
                return;
            }

            const totalMarks = subjects.reduce((sum, item) => sum + item.marks, 0);
            const average = totalMarks / subjects.length;

            let grade, color, label;
            if (average >= 90) {
                grade = 'A+'; color = '#22c55e'; label = 'Excellent';
            } else if (average >= 80) {
                grade = 'A'; color = '#22c55e'; label = 'Very Good';
            } else if (average >= 70) {
                grade = 'B'; color = '#f59e0b'; label = 'Good';
            } else if (average >= 60) {
                grade = 'C'; color = '#f59e0b'; label = 'Fair';
            } else if (average >= 50) {
                grade = 'D'; color = '#ef4444'; label = 'Needs Improvement';
            } else {
                grade = 'F'; color = '#ef4444'; label = 'Fail';
            }

            resultBox.innerHTML = `
                <div class="student">Student: <strong>${studentName || 'Unknown Student'}</strong></div>
                <div class="average">${average.toFixed(2)}%</div>
                <div class="grade-badge" style="background: ${color};">${grade}</div>
                <div style="color: var(--muted); font-size: 0.85rem; margin-top: 8px;">${label}</div>
            `;

            document.getElementById('subjectCount').textContent = subjects.length;
            document.getElementById('totalMarks').textContent = totalMarks;
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear all data?')) {
                subjects = [];
                document.getElementById('studentName').value = '';
                document.getElementById('subjectName').value = '';
                document.getElementById('marks').value = '';
                document.getElementById('marksError').textContent = '';
                renderSubjects();
                calculateGrade();
            }
        }

        document.getElementById('marks').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                addSubject();
            }
        });

        renderSubjects();
        calculateGrade();
    </script>
</body>
</html>
