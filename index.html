<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-btn {
            background: #667eea;
            color: white;
        }

        .add-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn {
            background: #764ba2;
            color: white;
        }

        .calculate-btn:hover {
            background: #653a87;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        .subjects-list {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #f0f0f0;
        }

        .subject-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-info {
            flex: 1;
        }

        .subject-name {
            font-weight: 600;
            color: #333;
        }

        .subject-marks {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .result {
            background: #f0f8ff;
            border: 2px solid #667eea;
            border-radius: 5px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
        }

        .result h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .average {
            font-size: 32px;
            font-weight: bold;
            color: #764ba2;
            margin: 10px 0;
        }

        .grade {
            font-size: 20px;
            color: #555;
            margin-top: 10px;
        }

        .grade-badge {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 10px;
            font-weight: 600;
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
        }

        .no-subjects {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Student Grade Calculator</h1>

        <div class="form-group">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="Enter student name">
        </div>

        <div class="form-group">
            <label for="subjectName">Subject Name:</label>
            <input type="text" id="subjectName" placeholder="e.g., Mathematics, Science, English">
        </div>

        <div class="form-group">
            <label for="marks">Marks (out of 100):</label>
            <input type="number" id="marks" placeholder="Enter marks" min="0" max="100">
            <div class="error" id="marksError"></div>
        </div>

        <div class="button-group">
            <button class="add-btn" onclick="addSubject()">Add Subject</button>
            <button class="calculate-btn" onclick="calculateGrade()">Calculate</button>
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>

        <div class="subjects-list" id="subjectsContainer">
            <div class="no-subjects">No subjects added yet. Add a subject to get started!</div>
        </div>

        <div id="resultContainer"></div>
    </div>

    <script>
        let subjects = [];

        function addSubject() {
            const studentName = document.getElementById('studentName').value.trim();
            const subjectName = document.getElementById('subjectName').value.trim();
            const marks = parseFloat(document.getElementById('marks').value);

            // Clear previous errors
            document.getElementById('marksError').textContent = '';

            // Validation
            if (!studentName) {
                alert('Please enter student name');
                return;
            }

            if (!subjectName) {
                alert('Please enter subject name');
                return;
            }

            if (isNaN(marks) || marks < 0 || marks > 100) {
                document.getElementById('marksError').textContent = 'Marks must be between 0 and 100';
                return;
            }

            // Add subject
            subjects.push({
                name: subjectName,
                marks: marks
            });

            // Clear inputs
            document.getElementById('subjectName').value = '';
            document.getElementById('marks').value = '';

            displaySubjects();
        }

        function removeSubject(index) {
            subjects.splice(index, 1);
            displaySubjects();
            document.getElementById('resultContainer').innerHTML = '';
        }

        function displaySubjects() {
            const container = document.getElementById('subjectsContainer');

            if (subjects.length === 0) {
                container.innerHTML = '<div class="no-subjects">No subjects added yet. Add a subject to get started!</div>';
                return;
            }

            let html = '';
            subjects.forEach((subject, index) => {
                html += `
                    <div class="subject-item">
                        <div class="subject-info">
                            <div class="subject-name">${subject.name}</div>
                            <div class="subject-marks">Marks: ${subject.marks}/100</div>
                        </div>
                        <button class="remove-btn" onclick="removeSubject(${index})">Remove</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function calculateGrade() {
            const studentName = document.getElementById('studentName').value.trim();

            if (!studentName) {
                alert('Please enter student name');
                return;
            }

            if (subjects.length === 0) {
                alert('Please add at least one subject');
                return;
            }

            // Calculate average
            const totalMarks = subjects.reduce((sum, subject) => sum + subject.marks, 0);
            const average = totalMarks / subjects.length;

            // Determine grade
            let grade, color;
            if (average >= 90) {
                grade = 'A+';
                color = '#27ae60';
            } else if (average >= 80) {
                grade = 'A';
                color = '#27ae60';
            } else if (average >= 70) {
                grade = 'B';
                color = '#f39c12';
            } else if (average >= 60) {
                grade = 'C';
                color = '#f39c12';
            } else if (average >= 50) {
                grade = 'D';
                color = '#e74c3c';
            } else {
                grade = 'F';
                color = '#e74c3c';
            }

            // Display result
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = `
                <div class="result">
                    <h2>📊 Result for ${studentName}</h2>
                    <div class="average">${average.toFixed(2)}%</div>
                    <div class="grade">
                        Grade: <span class="grade-badge" style="background: ${color};">${grade}</span>
                    </div>
                    <div style="margin-top: 15px; font-size: 12px; color: #666;">
                        Total Subjects: ${subjects.length} | Total Marks: ${totalMarks}
                    </div>
                </div>
            `;
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear everything?')) {
                document.getElementById('studentName').value = '';
                document.getElementById('subjectName').value = '';
                document.getElementById('marks').value = '';
                subjects = [];
                document.getElementById('resultContainer').innerHTML = '';
                displaySubjects();
            }
        }

        // Allow Enter key to add subject
        document.getElementById('marks').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addSubject();
            }
        });
    </script>
</body>
</html>
